[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
image = "0.25"
ndarray = "0.17"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.11"
dirs = "7"
tracing = "0.1"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "ndarray", "tls-rustls"] }
