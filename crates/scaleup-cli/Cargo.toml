[package]
name = "scaleup-cli"
description = "scaleup command line: upscayl-bin compatible AI image upscaler"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "scaleup"
path = "src/main.rs"

[dependencies]
scaleup-core = { path = "../scaleup-core" }
scaleup-wgpu = { path = "../scaleup-wgpu" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rayon = "1"
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
image = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
