[package]
name = "scaleup-app"
description = "ScaleUP desktop app: AI image upscaling with a before/after view"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "scaleup-app"
path = "src/main.rs"

[dependencies]
scaleup-core = { path = "../scaleup-core" }
eframe = { version = "0.34", features = ["default", "persistence", "wgpu"] }
rfd = "0.15"
open = "5"
image = { workspace = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
scaleup-core = { path = "../scaleup-core", features = ["testing"] }
tempfile = "3"
