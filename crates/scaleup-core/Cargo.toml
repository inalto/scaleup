[package]
name = "scaleup-core"
description = "AI image upscaling engine: tiling, alpha, TTA, resize, model registry, ONNX Runtime backend"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "scaleup_core"

[features]
# Exposes the deterministic `backend::fake::NearestModel` to downstream test code.
testing = []

[dependencies]
image.workspace = true
ndarray.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
sha2.workspace = true
dirs.workspace = true
tracing.workspace = true
ort.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ort = { workspace = true, features = ["cuda"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { workspace = true, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[dev-dependencies]
tempfile = "3"
