[package]
name = "scaleup-wgpu"
description = "Pure-Rust GPU backend for ScaleUP: runs ncnn models on Vulkan, Metal and DX12 through wgpu compute shaders"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "scaleup_wgpu"

[dependencies]
scaleup-core = { path = "../scaleup-core" }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
tracing.workspace = true
safetensors = "0.8"
regex = "1"
zip = { version = "9", default-features = false }

[dev-dependencies]
tempfile = "3"
image = { workspace = true }
